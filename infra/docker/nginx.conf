upstream identity {
    server identity:8001;
}
upstream portal {
    server portal:8002;
}
upstream exam {
    server exam:8003;
}
upstream notification {
    server notification:8004;
}
upstream billing {
    server billing:8005;
}
upstream ai {
    server ai:8006;
}
upstream analytics {
    server analytics:8007;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # Health check for nginx itself
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Per-service health checks
    location /identity/health { proxy_pass http://identity/health; }
    location /exam/health { proxy_pass http://exam/health; }
    location /notification/health { proxy_pass http://notification/health; }
    location /billing/health { proxy_pass http://billing/health; }
    location /ai/health { proxy_pass http://ai/health; }
    location /analytics/health { proxy_pass http://analytics/health; }
    location /portal/health { proxy_pass http://portal/health/; }

    # Identity service
    location /api/v1/auth/ {
        proxy_pass http://identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/users/ {
        proxy_pass http://identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/institutions/ {
        proxy_pass http://identity;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Portal (Django + HTMX)
    location /dashboard/ {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /students/ {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /attendance/ {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /fees/ {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Exam service
    location /api/v1/exam/ {
        proxy_pass http://exam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/questions/ {
        proxy_pass http://exam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/tests/ {
        proxy_pass http://exam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/results/ {
        proxy_pass http://exam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Notification service
    location /api/v1/notifications/ {
        proxy_pass http://notification;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Billing service
    location /api/v1/payments/ {
        proxy_pass http://billing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/subscriptions/ {
        proxy_pass http://billing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/invoices/ {
        proxy_pass http://billing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI service
    location /api/v1/doubts/ {
        proxy_pass http://ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/recommendations/ {
        proxy_pass http://ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Analytics service
    location /api/v1/reports/ {
        proxy_pass http://analytics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/dashboards/ {
        proxy_pass http://analytics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
