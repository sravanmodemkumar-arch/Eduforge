<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Group Name</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Institutions</th>
                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Students</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Owner</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Plan</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            {% for g in groups %}
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 text-sm font-medium text-gray-900">{{ g.name }}</td>
                <td class="px-4 py-3 text-sm text-gray-500">{{ g.group_type }}</td>
                <td class="px-4 py-3 text-sm text-gray-900 text-right font-medium">{{ g.institution_count }}</td>
                <td class="px-4 py-3 text-sm text-gray-900 text-right">{{ g.total_students|floatformat:0 }}</td>
                <td class="px-4 py-3 text-sm text-gray-500">{{ g.owner }}</td>
                <td class="px-4 py-3 text-sm text-gray-500">{{ g.plan }} ({{ g.plan_amount }})</td>
                <td class="px-4 py-3"><span class="inline-flex items-center rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">{{ g.status }}</span></td>
                <td class="px-4 py-3 text-right"><a href="#" class="text-sm text-indigo-600 hover:text-indigo-800">View</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
