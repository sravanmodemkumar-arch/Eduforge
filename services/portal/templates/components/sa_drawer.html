{% comment %}
Super Admin Right Drawer Component
Usage: Wrap with x-data="{ drawerOpen: false }" and toggle drawerOpen
{% endcomment %}
<div x-show="drawerOpen"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-hidden"
     style="display: none;"
     @keydown.escape.window="drawerOpen = false">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-gray-900 bg-opacity-50" @click="drawerOpen = false"></div>

    <!-- Drawer Panel -->
    <div class="fixed inset-y-0 right-0 flex max-w-full">
        <div x-show="drawerOpen"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="translate-x-full"
             class="w-screen {{ drawer_width|default:'max-w-md' }}">
            <div class="flex h-full flex-col overflow-y-auto bg-white shadow-2xl">
                <!-- Header -->
                <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
                    <h2 class="text-lg font-semibold text-gray-900">{{ drawer_title|default:"Details" }}</h2>
                    <button @click="drawerOpen = false" class="rounded-lg p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <!-- Body -->
                <div class="flex-1 px-6 py-4" id="drawer-body">
                    {% block drawer_body %}
                    <p class="text-sm text-gray-500">Drawer content goes here.</p>
                    {% endblock %}
                </div>
                <!-- Footer -->
                <div class="border-t border-gray-200 px-6 py-4">
                    {% block drawer_footer %}
                    <div class="flex items-center justify-end gap-3">
                        <button @click="drawerOpen = false"
                                class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">
                            Close
                        </button>
                    </div>
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>
</div>
