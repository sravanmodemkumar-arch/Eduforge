{% comment %}Bulk action toolbar — shown when rows are selected. Wrap table in Alpine x-data with selectedRows array.{% endcomment %}
<div x-show="selectedRows.length > 0"
     x-transition
     class="sticky bottom-0 z-10 bg-indigo-600 text-white px-4 py-3 flex items-center justify-between rounded-b-lg shadow-lg"
     x-cloak>
    <div class="flex items-center space-x-2">
        <span class="text-sm font-medium" x-text="selectedRows.length + ' selected'"></span>
        <button @click="selectedRows = []" class="text-indigo-200 hover:text-white text-sm underline">Clear</button>
    </div>
    <div class="flex items-center space-x-2">
        {% if show_suspend %}
        <button class="inline-flex items-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-medium hover:bg-indigo-400">
            <svg class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" /></svg>
            Suspend
        </button>
        {% endif %}
        <button class="inline-flex items-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-medium hover:bg-indigo-400">
            <svg class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
            Export
        </button>
        <button class="inline-flex items-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm font-medium hover:bg-indigo-400">
            <svg class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
            Notify
        </button>
        {% if show_delete %}
        <button class="inline-flex items-center rounded-md bg-red-500 px-3 py-1.5 text-sm font-medium hover:bg-red-400">
            <svg class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
            Delete
        </button>
        {% endif %}
    </div>
</div>
