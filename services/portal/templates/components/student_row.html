{% load portal_tags %}
{% for student in students %}
<tr id="student-row-{{ student.id }}" class="hover:bg-gray-50">
    <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500">{{ student.roll_number }}</td>
    <td class="whitespace-nowrap px-6 py-4 text-sm font-medium text-gray-900">
        <a href="/students/{{ student.id }}/" class="text-indigo-600 hover:text-indigo-900">
            {{ student.metadata.name|default:"--" }}
        </a>
    </td>
    <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500">{{ student.class_name }}</td>
    <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-500">{{ student.section }}</td>
    <td class="whitespace-nowrap px-6 py-4 text-sm">
        <span class="inline-flex rounded-full px-2 text-xs font-semibold leading-5
            {% if student.residential_status == 'DAY_SCHOLAR' %}bg-green-100 text-green-800
            {% elif student.residential_status == 'HOSTELER' %}bg-blue-100 text-blue-800
            {% else %}bg-yellow-100 text-yellow-800{% endif %}">
            {{ student.get_residential_status_display }}
        </span>
    </td>
    <td class="whitespace-nowrap px-6 py-4 text-sm">
        <a href="/students/{{ student.id }}/"
           class="text-indigo-600 hover:text-indigo-900 mr-3">View</a>
        <a href="/students/{{ student.id }}/update/"
           class="text-gray-600 hover:text-gray-900">Edit</a>
    </td>
</tr>
{% endfor %}
