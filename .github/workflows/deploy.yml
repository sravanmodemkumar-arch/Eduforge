name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy-lambda-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, exam, notification, billing, ai, analytics]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        run: |
          docker build -t $ECR_REGISTRY/eduforge-${{ matrix.service }}:latest \
            services/${{ matrix.service }}/
          docker push $ECR_REGISTRY/eduforge-${{ matrix.service }}:latest

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name eduforge-${{ matrix.service }} \
            --image-uri $ECR_REGISTRY/eduforge-${{ matrix.service }}:latest

  deploy-ecs-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push portal image
        run: |
          docker build -t $ECR_REGISTRY/eduforge-portal:latest services/portal/
          docker push $ECR_REGISTRY/eduforge-portal:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster eduforge \
            --service eduforge-portal \
            --force-new-deployment

  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-lambda-services, deploy-ecs-portal]
    steps:
      - name: Wait for deployment
        run: sleep 60

      - name: Check service health
        run: |
          API_URL="${{ secrets.API_GATEWAY_URL }}"
          for service in identity exam notification billing ai analytics; do
            echo "Checking $service..."
            curl -sf "$API_URL/$service/health" || echo "WARNING: $service health check failed"
          done
          echo "Checking portal..."
          curl -sf "${{ secrets.PORTAL_URL }}/health/" || echo "WARNING: portal health check failed"
